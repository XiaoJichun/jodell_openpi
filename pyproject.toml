[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot",
    "ml_collections==1.0.0",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "opencv-python==4.11.0.86",
    "openpi-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "treescope>=0.1.7",
    "transformers==4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
    "rospkg>=1.6.0",
    # "y1-sdk",
    # "pyorbbecsdk",
]


[project.urls]
Repository = "https://github.com/Physical-Intelligence/openpi"

[dependency-groups]
# uv sync --no-default-groups --group inference-server (includes root model dependencies).
inference-server = [{ include-group = "inference-terminal" }]
inference-terminal = ["questionary>=2.1,<3", "PyYAML>=6,<7"]
# Use --only-group for clients: do not install root JAX/Torch/training dependencies.
inference-client = [
    { include-group = "inference-terminal" },
    "openpi-client",
    "openpi-async_bspline[plot]",
    "openpi-trajectory-recorder[plot]",
    "numpy==1.26.4",
    "imageio>=2.36.1",
    "imageio-ffmpeg>=0.5,<1",
]
inference-sim = [
    { include-group = "inference-client" },
    "gym-aloha==0.1.1",
    "mujoco==2.3.7",
    "dm-control==1.0.14",
]
inference-real = [
    { include-group = "inference-client" },
    "opencv-python==4.11.0.86",
    "rerun-sdk==0.23.1",
    # Add "y1-sdk" here AFTER configuring the matching vendor source below.
]
inference-v4l2 = ["v4l2==0.2"]
# Vendor SDK is deliberately not resolved from an unverified public package.
# After obtaining a matching wheel, uncomment BOTH group and source entries:
# inference-orbbec = ["pyorbbecsdk"]
inference-test = ["pytest>=8.3.4", "ruff>=0.8.6"]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
rlds = [
    "dlimp",
    "tensorflow-cpu==2.15.0",
    "tensorflow-datasets==4.9.9",
]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi-client = { workspace = true }
openpi-async_bspline = { path = "packages/openpi-async_bspline", editable = true }
openpi-trajectory-recorder = { path = "packages/openpi-trajectory-recorder", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
# lerobot = { path = "/your_path/lerobot" } # 如果在下载安装lerobot环境时很慢，可以提前下载好，然后替换为你的实际本地路径
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }
# y1-sdk = { path = "/absolute/vendor/y1_sdk_python/y1_sdk", editable = true } # 配合 inference-real 中 y1-sdk 启用
# pyorbbecsdk = { path = "/absolute/vendor/pyorbbecsdk-version-cp311-cp311-linux_x86_64.whl" } # 配合 inference-orbbec 启用

[tool.uv.workspace]
members = ["packages/*"]
# Plugins remain standalone packages; root inference groups reference them by path.
exclude = ["packages/openpi-async_bspline", "packages/openpi-trajectory-recorder"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docker", "third_party", "src/openpi/models_pytorch/transformers_replace/*"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
